name = "videokurzy"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "videokurzy-db"
database_id = "TBD"
migrations_dir = "drizzle/migrations"

[[kv_namespaces]]
binding = "KV"
id = "TBD"
preview_id = "TBD"

[[queues.producers]]
queue = "videokurzy-webhooks"
binding = "WEBHOOK_QUEUE"

[[queues.consumers]]
queue = "videokurzy-webhooks"
max_batch_size = 5
max_retries = 3
