name = "videokurzy"
main = "src/index.tsx"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "videokurzy-db"
database_id = "c4e3cf23-d6c8-4c63-94ca-d6c64809ca9f"
migrations_dir = "drizzle/migrations"

[[kv_namespaces]]
binding = "KV"
id = "afc09797ca644747b2c159f705334fb0"
preview_id = "0781f693950c4ed4998f7ba022a473fc"

[[queues.producers]]
queue = "videokurzy-webhooks"
binding = "WEBHOOK_QUEUE"

[[queues.consumers]]
queue = "videokurzy-webhooks"
max_batch_size = 5
max_retries = 3

[triggers]
crons = ["0 3 * * *"]

[env.test]
[[env.test.d1_databases]]
binding = "DB"
database_name = "videokurzy-db-test"
# placeholder UUID; miniflare uses local SQLite in-memory for tests
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle/migrations"

[[env.test.kv_namespaces]]
binding = "KV"
id = "test-kv"

[env.test.vars]
AUTH_INTERNAL_SECRET = "test-internal-secret"
BETTER_AUTH_SECRET = "test-better-auth-secret-32-chars-minimum"
BETTER_AUTH_URL = "http://localhost:8787"
RESEND_API_KEY = "test-resend-key"
# NOTE: COOKIE_DOMAIN intentionally unset in test env → host-only cookies, matches dev behavior.

# TODO(deploy): update `deploy` script in package.json to `wrangler deploy --env production`
# so that the values below actually apply. Until then, the default env (no `--env`) is used
# and COOKIE_DOMAIN is undefined in production. Session cookies will remain host-only.
[env.production]
[env.production.vars]
COOKIE_DOMAIN = ".vibecoding.cz"
