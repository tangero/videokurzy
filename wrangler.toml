name = "videokurzy"
main = "src/index.tsx"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret runtime vars. POZOR: plain-text vars nastavené jen v CF dashboardu
# `wrangler deploy` PŘEPÍŠE podle tohoto souboru (smaže je). Proto patří sem,
# ne do dashboardu. Secrets (OPENROUTER_API_KEY, RESEND_API_KEY, …) deploy nemaže
# — ty zůstávají v dashboardu.
[vars]
# Zapíná LLM redakční vrstvu „Novinky v Claude Code": digest se přepíše do plné
# češtiny přes OpenRouter (vyžaduje secret OPENROUTER_API_KEY). Bez "1" se vrací
# jen anglická deterministická kostra (viz lib/cc-news/editor.ts).
CC_NEWS_LLM = "1"
# Provozní brána reálného odesílání e-mailů „Novinky v Claude Code" (schvalovací
# e-mail i newsletter). "0" = povol live odeslání; cokoli jiného / chybějící =
# dry-run (jen log, NEodesílá). MUSÍ být tady v tomlu, ne jen v dashboardu —
# `wrangler deploy` dashboard vars mimo toml MAŽE (proto se hodnota po deployi
# ztrácela a rozeslání padalo do dry-run). Live odeslání stejně vyžaduje i druhou
# bránu cc_news_live_send (DB) + RESEND_API_KEY, takže samotná "0" nic nerozešle
# bez admin přepínače. env.test toto NEdědí → testy zůstávají dry-run.
CC_NEWS_DRY_RUN = "0"
# Meta konverzní měření (Conversions API). Pixel/Dataset ID je veřejné, patří sem
# (deploy by ho z dashboardu smazal). CAPI token je secret → `wrangler secret put
# META_CAPI_TOKEN`. Dataset "Videokurzy" v Events Manageru, oddělený od vibecoding.
META_PIXEL_ID = "986046454414686"
# Verze Graph API (override defaultu v conversions.ts). Aktualizuj dle changelogu Meta.
META_API_VERSION = "v23.0"
# Sklik (Seznam) — veřejná ID. Konverze (conversionHit na success/pay stránce) a
# retargeting (retargetingHit na všech stránkách) jsou DVĚ různá ID.
SKLIK_CONVERSION_ID = "100281202"
SKLIK_RETARGETING_ID = "161175"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "videokurzy-db"
database_id = "c4e3cf23-d6c8-4c63-94ca-d6c64809ca9f"
migrations_dir = "drizzle/migrations"

[[kv_namespaces]]
binding = "KV"
id = "afc09797ca644747b2c159f705334fb0"
preview_id = "0781f693950c4ed4998f7ba022a473fc"

[[queues.producers]]
queue = "videokurzy-webhooks"
binding = "WEBHOOK_QUEUE"

[[queues.consumers]]
queue = "videokurzy-webhooks"
max_batch_size = 5
max_retries = 3
# Po vyčerpání max_retries Cloudflare zprávu NEzahodí, ale přesune do DLQ.
# Bez tohohle by selhaný checkout.session.completed (zákazník zaplatil, ale
# přístup/faktura nevznikly) zmizel beze stopy.
dead_letter_queue = "videokurzy-webhooks-dlq"

# DLQ konzument: zprávy, které 3× selhaly v hlavním zpracování. Už neretryuje,
# jen je zaloguje a upozorní admina na nutný ruční zásah (viz handleDlq).
[[queues.consumers]]
queue = "videokurzy-webhooks-dlq"
max_batch_size = 1
max_retries = 0

[triggers]
crons = ["0 3 * * *"]

[env.test]
[[env.test.d1_databases]]
binding = "DB"
database_name = "videokurzy-db-test"
# placeholder UUID; miniflare uses local SQLite in-memory for tests
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle/migrations"

[[env.test.kv_namespaces]]
binding = "KV"
id = "test-kv"

[env.test.vars]
AUTH_INTERNAL_SECRET = "test-internal-secret"
BETTER_AUTH_SECRET = "test-better-auth-secret-32-chars-minimum"
BETTER_AUTH_URL = "http://localhost:8787"
RESEND_API_KEY = "test-resend-key"
VIBECODING_PARTNER_KEY = "test-partner-key"
# NOTE: COOKIE_DOMAIN intentionally unset in test env → host-only cookies, matches dev behavior.

# [env.production] section was removed: deploys now go to the default
# `videokurzy` worker (the one bound to kurzy.vibecoding.cz). Production-only
# vars/secrets (COOKIE_DOMAIN, BUNNY_PULL_ZONE, ...) are set directly on the
# `videokurzy` worker via the Cloudflare dashboard.
